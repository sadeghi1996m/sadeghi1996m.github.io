{% comment %}
Theme switching is disabled; keep the keyboard handler with the commented
control in masthead.html so both can be restored together.
<script>
  document.querySelector('#theme-toggle a').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      this.click();
    }
  });
</script>
{% endcomment %}
